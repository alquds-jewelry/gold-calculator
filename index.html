<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>حاسبة أسعار الذهب</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; max-width: 400px; margin: auto; background-color: #f9f9f9; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #d4af37; text-align: center; }
        label { font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 10px 0 20px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .result { font-size: 22px; font-weight: bold; color: #2c3e50; text-align: center; padding: 15px; background: #e8f6e9; border-radius: 5px; border: 1px solid #c8e6c9;}
    </style>
</head>
<body>
    <h2>حاسبة مجوهرات القدس</h2>
    
    <label>سعر الجرام اليوم (جنيه):</label>
    <input type="number" id="gramPrice" placeholder="مثال: 3500" oninput="calculate()">

    <label>وزن القطعة (جرام):</label>
    <input type="number" id="weight" placeholder="مثال: 15" oninput="calculate()">

    <label>مصنعية الجرام (جنيه):</label>
    <input type="number" id="makingCharge" placeholder="مثال: 150" oninput="calculate()">

    <div class="result">الإجمالي: <span id="total">0</span> جنيه</div>

    <script>
        function calculate() {
            let price = parseFloat(document.getElementById('gramPrice').value) || 0;
            let weight = parseFloat(document.getElementById('weight').value) || 0;
            let charge = parseFloat(document.getElementById('makingCharge').value) || 0;
            
            // حساب الإجمالي: (سعر الجرام + المصنعية) × الوزن
            let total = (price + charge) * weight;
            
            document.getElementById('total').innerText = total.toLocaleString('ar-EG');
        }
    </script>
</body>
</html>
